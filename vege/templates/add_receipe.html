{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Add Recipe</title>
</head>
<body style="background: #f4f6f9;">
    <div class="container mt-5">
        <div class="card shadow-lg p-4 col-md-8 mx-auto">
            <h2 class="text-center text-success mb-4">Add Recipe</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Recipe Name</label>
                    <input name="receipe_name" type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="receipe_description" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Steps to Cook</label>
                    <textarea name="receipe_steps" rows="5" class="form-control" placeholder="Write step-by-step instructions"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Recipe Image</label>
                    <input type="file" name="receipe_image" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Add Recipe</button>
            </form>
        </div>
    </div>
</body>
</html>
